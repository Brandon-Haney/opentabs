pre-commit:
  commands:
    reject-ralph-state:
      run: sh scripts/hooks/reject-ralph-state.sh
    auto-stage-lockfiles:
      run: sh scripts/hooks/auto-stage-lockfiles.sh
    biome-check-ts:
      glob: "*.{ts,tsx}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    biome-format-json:
      glob: "*.json"
      run: npx biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    biome-format-md:
      glob: "*.md"
      run: npx biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    build:
      run: npm run build
    lint:
      run: npm run lint
    test:
      run: npm run test
